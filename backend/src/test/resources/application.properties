spring.application.name=backend

# WHY: テストは専用 DB（WBS 8b）を待たずに回す。本番と同じ Flyway の SQL を H2 の PostgreSQL 互換モードに流す。
#      .env は読まない（テストが手元の実 DB に触れないようにするため）。
spring.datasource.url=jdbc:h2:mem:lending;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# WHY: テストから本物の Dify を呼ばない（無料枠のクレジットは補充されない）。Dify の分岐は DifyClientTest が模擬サーバーで見る。
dify.api-key=
