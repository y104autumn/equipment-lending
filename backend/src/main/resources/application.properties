spring.application.name=backend

# WHY: DB の接続情報と Dify の API キーは git 管理外の backend/.env にだけ置く（scripts/create_db.ps1 が書く）。
#      optional: にしているのは、.env が無くてもテスト（H2）は起動できるようにするため。
spring.config.import=optional:file:.env[.properties]

# WHY: テーブルは Flyway の SQL が正。JPA にはテーブルを作らせず、エンティティとの食い違いを起動時に検出させる。
spring.jpa.hibernate.ddl-auto=validate
# WHY: 画面の描画中に遅延ロードで SQL が走るのを防ぐ（取得はサービス層で終える）。
spring.jpa.open-in-view=false
